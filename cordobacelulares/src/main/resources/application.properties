spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.show-sql = true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.defer-datasource-initialization=true

#logging.level.root=TRACE

# Resiliece4j Configuration
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.shared.sliding-window-type=count_based
resilience4j.circuitbreaker.configs.default.sliding-window-size=2
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50

tiendaporte.auth-base-url=${TIENDAPORTE_AUTH_BASE_URL:https://sistema.tiendaporte.com}
tiendaporte.api-base-url=${TIENDAPORTE_API_BASE_URL:https://api.tiendaporte.com}
tiendaporte.products-limit=${TIENDAPORTE_PRODUCTS_LIMIT:5000}
tiendaporte.connect-timeout-seconds=${TIENDAPORTE_CONNECT_TIMEOUT_SECONDS:10}
tiendaporte.request-timeout-seconds=${TIENDAPORTE_REQUEST_TIMEOUT_SECONDS:30}
tiendaporte.catalog-cache.ttl-ms=${TIENDAPORTE_CATALOG_CACHE_TTL_MS:180000}
tiendaporte.catalog-cache.refresh-ms=${TIENDAPORTE_CATALOG_CACHE_REFRESH_MS:180000}
tiendaporte.catalog-cache.initial-delay-ms=${TIENDAPORTE_CATALOG_CACHE_INITIAL_DELAY_MS:5000}

supplier-sheet.enabled=${SUPPLIER_SHEET_ENABLED:true}
supplier-sheet.csv-url=${SUPPLIER_SHEET_CSV_URL:https://docs.google.com/spreadsheets/d/e/2PACX-1vQq-A-ZD2CU9qt9hd8DCbMjfY8yi503PrF8hiAhyyanaJcVDSxu2pPUWj73v-Imhym9aYGs66bPamIB/pub?gid=0&single=true&output=csv}
supplier-sheet.cache-minutes=${SUPPLIER_SHEET_CACHE_MINUTES:5}

liberadosya.enabled=${LIBERADOSYA_ENABLED:true}
liberadosya.base-url=${LIBERADOSYA_BASE_URL:https://liberadosya.com}
liberadosya.sitemap-url=${LIBERADOSYA_SITEMAP_URL:https://liberadosya.com/sitemap.xml}
liberadosya.refresh-cron=${LIBERADOSYA_REFRESH_CRON:0 0 */6 * * *}
liberadosya.initial-refresh=${LIBERADOSYA_INITIAL_REFRESH:true}
liberadosya.request-delay-ms=${LIBERADOSYA_REQUEST_DELAY_MS:400}
liberadosya.connect-timeout-seconds=${LIBERADOSYA_CONNECT_TIMEOUT_SECONDS:10}
liberadosya.read-timeout-seconds=${LIBERADOSYA_READ_TIMEOUT_SECONDS:25}
liberadosya.max-retries=${LIBERADOSYA_MAX_RETRIES:2}
liberadosya.max-concurrency=${LIBERADOSYA_MAX_CONCURRENCY:4}
liberadosya.ambiguity-threshold=${LIBERADOSYA_AMBIGUITY_THRESHOLD:5}
liberadosya.minimum-match-score=${LIBERADOSYA_MINIMUM_MATCH_SCORE:80}
liberadosya.storage-path=${LIBERADOSYA_STORAGE_PATH:./data/liberadosya/catalog-current.json}
