#version: '3.8'

services:

  angular_app:
    container_name: angular_app
    image: angular_app_1.0
    build: ./AngularBoostrapCordobaCelulares/cordobacelulares
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - practicapp
    networks:
      - backend
  practicapp:
    build: .
    image: practicapp
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db_cel
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_cel:5432/postgres
      - SPRING_DATASOURCE_USERNAME=nicolas
      - SPRING_DATASOURCE_PASSWORD=nicolas12
      - SEO_PRODUCT_MEDIA_DIRECTORY=/data/product-media
      - HOME_BANNER_MEDIA_DIRECTORY=/data/home-banner-media
      - BOMBAI_ADMIN_USERNAME=${BOMBAI_ADMIN_USERNAME:?BOMBAI_ADMIN_USERNAME requerida}
      - BOMBAI_ADMIN_PASSWORD=${BOMBAI_ADMIN_PASSWORD:?BOMBAI_ADMIN_PASSWORD requerida}
    volumes:
      - product_media_volume:/data/product-media
      - home_banner_media_volume:/data/home-banner-media
    networks:
      - database
      - backend

  db_cel:
    image: postgres
    environment:
      - POSTGRES_USER=nicolas
      - POSTGRES_PASSWORD=nicolas12
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    networks:
      - database

volumes:
  postgres_volume:
  product_media_volume:
  home_banner_media_volume:

networks:
  database:
    driver: bridge
  backend:
    driver: bridge
