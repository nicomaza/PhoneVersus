#version: '3.8'

services:

  angular_app:
    container_name: angular_app
    image: angular_app_1.0
    build: ./AngularBoostrapCordobaCelulares/cordobacelulares
    ports:
      - 8081:80
    depends_on:
      - practicapp
  practicapp:
    build: .
    image: practicapp
    ports:
      - 8080:8080
    depends_on:
      - db_cel
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_cel:5432/postgres
      - SPRING_DATASOURCE_USERNAME=nicolas
      - SPRING_DATASOURCE_PASSWORD=nicolas12
    networks:
      - database
      - backend

  db_cel:
    image: postgres
    environment:
      - POSTGRES_USER=nicolas
      - POSTGRES_PASSWORD=nicolas12
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    networks:
      - database

volumes:
  postgres_volume:

networks:
  database:
    driver: bridge
  backend:
    driver: bridge
